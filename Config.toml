    { note = 48, frequency_ratio = 8.0 },
    { note = 60, frequency_ratio = 6.0 },
    { note = 72, frequency_ratio = 4.0 },
]

# Cymbale III ranks (bright, high-pitched mixture)
[synth.stops."Cymbale III Rank 1"]
waveform = "triangle"
amplitude_ratio = 0.7
breaks = [
    { note = 0,  frequency_ratio = 8.0 },
    { note = 36, frequency_ratio = 6.0 },
    { note = 48, frequency_ratio = 4.0 },
    { note = 60, frequency_ratio = 3.0 },
    { note = 72, frequency_ratio = 2.0 },
]

[synth.stops."Cymbale III Rank 2"]
